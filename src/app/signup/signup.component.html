<app-navbar></app-navbar>
<div align="center">
    <h1>User Registration</h1>
    <table>
        <tr>
            <th>First Name: </th>
            <td><input type="text" name="firstName" [(ngModel)]="form.data.firstName"></td>
        </tr>
        <tr>
            <th>Last Name: </th>
            <td><input type="text" name="lastName" [(ngModel)]="form.data.lastName"></td>
        </tr>
        <tr>
            <th>Login ID: </th>
            <td><input type="text" name="loginId" [(ngModel)]="form.data.loginId"></td>
        </tr>
        <tr>
            <th>Password: </th>
            <td><input type="text" name="password" [(ngModel)]="form.data.password"></td>
        </tr>
        <tr>
            <th>DOB:</th>
            <td><input type="date" name="dob" style="width: 97%;" [(ngModel)]="form.data.dob"></td>
        </tr>
        <tr>
            <th>Address:</th>
            <td><input type="text" name="address" [(ngModel)]="form.data.address"></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button (click)="signUp()">signUp</button>
            </td>
        </tr>
    </table>
</div>
