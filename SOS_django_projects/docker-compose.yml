version: '3.8'

services:
  web:
    image: sos_django_projects-web:latest
    container_name: sos_django_projects-web-1
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=database
      - DB_NAME=your_db_name
      - DB_USER=your_db_user
      - DB_PASSWORD=your_db_password
    depends_on:
      database:
        condition: service_healthy
    restart: always

  database:
    image: mysql:8.0
    container_name: sos_django_projects-db-1
    environment:
      MYSQL_DATABASE: your_db_name
      MYSQL_USER: your_db_user
      MYSQL_PASSWORD: your_db_password
      MYSQL_ROOT_PASSWORD: your_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  mysql_data:
